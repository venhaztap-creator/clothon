<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clothon — Demo interactiva</title>
<meta name="description" content="Demo interactiva de la tienda en línea CLOTHON: catálogo, ficha de producto, carrito, favoritos, arma tu look y gift card.">
<style>
  @font-face{font-family:'Raleway';src:url('./assets/fonts/Raleway-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
  @font-face{font-family:'Raleway';src:url('./assets/fonts/Raleway-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
  @font-face{font-family:'Raleway';src:url('./assets/fonts/Raleway-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap;}
  @font-face{font-family:'Raleway';src:url('./assets/fonts/Raleway-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
  @font-face{font-family:'Enigma';src:url('./assets/fonts/Enigma.otf') format('opentype');font-display:swap;}

  :root{
    --bg:#f0efec; --surface:#ffffff;
    --ink:#111111; --ink-2:#555555; --muted:#999999; --faint:#cccccc;
    --hair:#eeeeee; --hair-2:#f2f2f2; --line:#e0e0e0; --chrome:#f4f4f2;
    --ok:#4a7a4a; --alert:#b33333;
    --sw-white:#ffffff; --sw-grey:#c8c8c8; --sw-sand:#ded8cc;
    --t1:#ececec; --t2:#e6e6e6; --t3:#e0e0e0; --t4:#d9d9d9; --t5:#d2d2d2; --t6:#c8c8c8; --t7:#f4f4f4;
    --ink-soft:color-mix(in oklab, var(--ink) 6%, transparent);
    --surface-soft:color-mix(in oklab, var(--surface) 86%, transparent);
    --font-body:'Raleway',Arial,sans-serif;
    --font-display:'Raleway',Arial,sans-serif;
    --font-logo:'Enigma','Raleway',sans-serif;
    --radius:10px;
    --shadow:0 18px 50px rgba(0,0,0,.10);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  img,svg{display:block;}
  h1,h2,h3,h4,h5,p,figure,ul{margin:0;}
  h1,h2,h3{font-family:var(--font-display);}
  ul{padding:0;list-style:none;}
  p{text-wrap:pretty;} h1,h2,h3{text-wrap:balance;}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  .skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--surface);padding:10px 16px;z-index:200;}
  .skip:focus{left:8px;top:8px;}

  /* ── chrome del sitio ─────────────────────────────────────────── */
  .wrap{max-width:1280px;margin:0 auto;padding:0 40px;}
  .sitebar{border-bottom:1px solid var(--hair);background:var(--surface);position:sticky;top:0;z-index:80;}
  .sitebar>.wrap{display:flex;align-items:center;gap:28px;height:76px;}
  .logo{font-family:var(--font-logo);font-size:23px;font-weight:700;letter-spacing:3px;line-height:1;}
  .mainnav{display:flex;gap:24px;margin:0 auto;align-items:center;}
  .mainnav a{font-size:12px;letter-spacing:1.5px;color:var(--ink-2);padding:5px 0;border-bottom:1px solid transparent;transition:.15s;display:inline-flex;align-items:center;gap:5px;}
  .mainnav a:hover,.mainnav a.on{color:var(--ink);border-bottom-color:var(--ink);}
  .mainnav .chev{display:inline-flex;transition:transform .2s ease;}
  .mainnav .chev svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .mainnav a[data-dd]:hover .chev,.mainnav a.on .chev{transform:rotate(180deg);}
  .actions{display:flex;gap:4px;align-items:center;}
  .icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;transition:background .15s;}
  .icon-btn:hover{background:var(--hair-2);}
  .icon-btn svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;}
  .cart-count{position:absolute;top:3px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:9.5px;display:grid;place-items:center;}
  .cart-count[hidden]{display:none;}

  /* ── mega menú (escritorio) ───────────────────────────────────── */
  .mega{position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 40px 80px rgba(0,0,0,.20);opacity:0;visibility:hidden;transform:translateY(-10px);transition:opacity .2s ease,transform .2s ease,visibility .2s;}
  .mega.open{opacity:1;visibility:visible;transform:none;}
  .mega-top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:15px 0;border-bottom:1px solid var(--hair);}
  .mega-top .eyebrow{font-size:10px;letter-spacing:2.8px;color:var(--ink-2);}
  .mega-top nav{display:flex;gap:28px;}
  .mega-top nav a{font-size:10.5px;letter-spacing:1.6px;color:var(--ink-2);padding:3px 0;border-bottom:1px solid transparent;transition:color .15s,border-color .15s;}
  .mega-top nav a:hover{color:var(--ink);border-bottom-color:var(--ink);}
  .mega-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;padding:26px 0 24px;align-items:start;}
  .mega-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 38px;align-content:start;}
  .mega-cat{min-width:0;}
  .mega-cat .head{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;letter-spacing:1.8px;color:var(--ink);padding-bottom:10px;border-bottom:1px solid var(--line);transition:border-color .18s;}
  .mega-cat:hover .head,.mega-cat.on .head{border-bottom-color:var(--ink);}
  .mega-cat .head .mk{display:inline-flex;width:12px;height:12px;flex-shrink:0;opacity:0;transform:translateX(-6px);transition:opacity .18s ease,transform .18s ease;}
  .mega-cat .head .mk svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .mega-cat:hover .head .mk,.mega-cat.on .head .mk{opacity:1;transform:none;}
  .mega-cat ul{margin-top:11px;display:flex;flex-direction:column;gap:9px;}
  .mega-cat li{min-width:0;}
  .mega-cat li a{position:relative;display:inline-block;font-size:12px;color:var(--ink-2);transition:color .15s;}
  .mega-cat li a::after{content:'';position:absolute;left:0;right:100%;bottom:-2px;height:1px;background:currentColor;transition:right .22s ease;}
  .mega-cat li a:hover{color:var(--ink);}
  .mega-cat li a:hover::after{right:0;}
  .mega-feat{border-left:1px solid var(--hair);padding-left:44px;display:block;min-width:0;}
  .mega-feat-frame{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:var(--t2);}
  .mega-feat-frame .cover{object-position:center 32%;transition:opacity .3s ease,transform .7s ease;}
  .mega-feat:hover .mega-feat-frame .cover{transform:scale(1.045);}
  .mega-feat-tag{position:absolute;left:12px;top:12px;z-index:2;background:var(--surface);color:var(--ink);font-size:9px;letter-spacing:1.8px;padding:7px 10px;}
  .mega-feat-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding-top:13px;}
  .mega-feat-meta .nm{font-size:12px;font-weight:600;letter-spacing:2.2px;}
  .mega-feat-meta .go,.mega-brands .all{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:1.6px;color:var(--ink-2);border-bottom:1px solid var(--line);padding-bottom:2px;transition:color .15s,border-color .15s;}
  .mega-feat-meta .go svg,.mega-brands .all svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .mega-feat:hover .mega-feat-meta .go{color:var(--ink);border-bottom-color:var(--ink);}
  .mega-brands{border-top:1px solid var(--hair);display:flex;align-items:center;flex-wrap:wrap;gap:0 26px;padding:15px 0;}
  .mega-brands h5{font-size:10px;letter-spacing:2.4px;color:var(--ink-2);margin-right:4px;}
  .mega-brands a{font-size:11.5px;color:var(--ink-2);padding:3px 0;border-bottom:1px solid transparent;transition:color .15s;white-space:nowrap;}
  .mega-brands a:hover{color:var(--ink);text-decoration:underline;}
  .mega-brands .all{margin-left:auto;color:var(--ink);border-bottom-color:var(--ink);}
  .mega-brands .all:hover{border-bottom-color:var(--ink);}

  /* ── menú móvil ───────────────────────────────────────────────── */
  .menu-btn{display:none;}
  .mnav,.mnav-bd{display:none;}
  .mnav{position:fixed;top:0;left:0;height:100%;width:min(370px,88%);background:var(--surface);z-index:130;transform:translateX(-100%);transition:transform .28s ease;flex-direction:column;overflow-y:auto;box-shadow:24px 0 60px rgba(0,0,0,.18);}
  .mnav.open{transform:none;}
  .mnav-bd{position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:125;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .mnav-bd.open{opacity:1;pointer-events:auto;}
  .mnav-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--hair);flex-shrink:0;}
  .mnav-head .logo{font-size:19px;letter-spacing:2px;}
  .mnav-links{display:flex;flex-direction:column;border-bottom:1px solid var(--hair-2);}
  .mnav-links a{padding:15px 22px;font-size:12.5px;letter-spacing:1.5px;border-bottom:1px solid var(--hair-2);}
  .mnav-links a:hover{background:var(--hair-2);}
  .mnav-search{margin:16px 22px 0;display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:999px;padding:12px 18px;font-size:12.5px;color:var(--muted);transition:border-color .15s;}
  .mnav-search:hover{border-color:var(--ink);color:var(--ink);}
  .mnav-search svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .mnav-sec{padding:22px 22px 4px;}
  .mnav-sec h5{font-size:10.5px;letter-spacing:2.5px;color:var(--muted);margin-bottom:10px;}
  .mnav-cat{border-bottom:1px solid var(--hair-2);}
  .mnav-cat>summary{list-style:none;cursor:pointer;padding:15px 0;font-size:13px;font-weight:600;letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center;min-height:44px;}
  .mnav-cat>summary::-webkit-details-marker{display:none;}
  .mnav-cat>summary .tog{color:var(--faint);transition:transform .2s;font-weight:400;}
  .mnav-cat[open]>summary .tog{transform:rotate(45deg);}
  .mnav-subs{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 16px;}
  .mnav-subs a{font-size:11.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;transition:.15s;}
  .mnav-subs a:hover{border-color:var(--ink);color:var(--ink);}
  .mnav-cta{margin:18px 22px 0;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--surface);padding:16px 18px;font-size:11px;letter-spacing:1.5px;transition:background .15s;}
  .mnav-cta:hover{background:var(--ink-2);}
  .mnav-brands{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;padding:0 22px 22px;}
  .mnav-brands a{font-size:12px;color:var(--ink-2);padding:7px 0;transition:color .15s;}
  .mnav-brands a:hover{color:var(--ink);text-decoration:underline;}
  .mnav-foot{padding:20px 22px 34px;border-top:1px solid var(--hair-2);margin-top:8px;display:flex;flex-direction:column;gap:4px;}
  .mnav-foot .soc{display:flex;gap:22px;margin-bottom:10px;}
  .mnav-foot a{font-size:12px;color:var(--ink-2);padding:6px 0;transition:color .15s;}
  .mnav-foot a:hover{color:var(--ink);}

  /* ── hero ─────────────────────────────────────────────────────── */
  .hero{position:relative;}
  .hero-media{position:relative;aspect-ratio:4/5;background:var(--t2);overflow:hidden;}
  .hero-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.44) 0%,rgba(0,0,0,.05) 34%,rgba(0,0,0,.05) 58%,rgba(0,0,0,.55) 100%);}
  .hero-copy{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;color:var(--surface);padding:0 24px 34px;gap:12px;}
  .hero-eyebrow{position:absolute;top:26px;left:0;right:0;z-index:2;text-align:center;font-size:11px;letter-spacing:4px;color:var(--surface);}
  .hero-title{font-size:33px;font-weight:700;letter-spacing:.07em;line-height:1.04;text-transform:uppercase;text-shadow:0 2px 22px rgba(0,0,0,.4);}
  .hero-text{font-size:12.5px;letter-spacing:.3px;color:rgba(255,255,255,.9);max-width:46ch;text-shadow:0 1px 12px rgba(0,0,0,.4);}
  .hero-arrow{position:absolute;top:50%;z-index:3;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.88);color:var(--ink);display:grid;place-items:center;font-size:18px;line-height:1;transition:background .15s,transform .15s;box-shadow:0 6px 18px rgba(0,0,0,.18);}
  .hero-arrow:hover{background:var(--surface);transform:translateY(-50%) scale(1.06);}
  .hero-arrow.left{left:12px;} .hero-arrow.right{right:12px;}
  .hero-count{position:absolute;top:22px;right:16px;z-index:3;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.94);background:rgba(0,0,0,.34);padding:6px 11px;border-radius:999px;}
  .hero-cta{margin-top:8px;}
  .hero-dots{display:flex;justify-content:center;gap:0;padding:0;}
  .hero-dots button{width:44px;height:44px;display:grid;place-items:center;}
  .hero-dots button::after{content:'';width:6px;height:3px;border-radius:2px;background:var(--line);transition:width .2s,background .2s;}
  .hero-dots button:hover::after{background:var(--muted);}
  .hero-dots button.on::after{width:20px;background:var(--ink);}

  .cover{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;}
  .hero-media .cover{object-position:center 28%;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:11px;letter-spacing:2px;padding:14px 26px;border-radius:2px;transition:background .15s,color .15s,border-color .15s;}
  .btn-dark{background:var(--ink);color:var(--surface);}
  .btn-dark:hover{background:var(--ink-2);}
  .btn-light{background:var(--surface);color:var(--ink);}
  .btn-light:hover{background:var(--hair);}
  .btn-outline{border:1px solid var(--ink);color:var(--ink);}
  .btn-outline:hover{background:var(--ink);color:var(--surface);}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  .ph{position:relative;overflow:hidden;display:grid;place-items:center;font-size:11px;color:var(--muted);letter-spacing:.5px;line-height:1.6;text-align:center;padding:10px;background:var(--t1);}

  /* ── secciones ────────────────────────────────────────────────── */
  .sec{margin-bottom:46px;}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:16px;}
  .sec-title{font-size:15px;font-weight:700;letter-spacing:2px;}
  .sec-rule{width:28px;height:1px;background:var(--ink);margin-top:9px;}
  .link-all{font-size:11.5px;color:var(--muted);text-decoration:underline;}
  .link-all:hover{color:var(--ink);}

  .brandstrip{border-block:1px solid var(--hair-2);margin:22px 0;padding:20px 0;}
  .brandstrip .wrap{display:flex;justify-content:space-between;gap:22px;flex-wrap:wrap;}
  .brandstrip a{font-size:12px;letter-spacing:2px;color:var(--muted);transition:color .15s;}
  .brandstrip a:hover{color:var(--ink);}

  .finder{max-width:820px;margin:0 auto;text-align:center;padding:16px 0 42px;}
  .finder-eyebrow{font-size:11px;letter-spacing:2.5px;color:var(--muted);margin-bottom:16px;}
  .finder-bar{display:flex;align-items:center;gap:6px;border:1px solid var(--ink);border-radius:999px;padding:6px;background:var(--surface);box-shadow:0 12px 30px rgba(0,0,0,.06);}
  .finder-field{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;}
  .finder-field select{appearance:none;border:0;background:transparent;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;flex:1;outline:0;}
  .finder-field .chev{color:var(--faint);}
  .finder-div{width:1px;align-self:stretch;background:var(--hair);margin:8px 0;}
  .finder-go{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:15px;flex-shrink:0;transition:background .15s;}
  .finder-go:hover{background:var(--ink-2);}

  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-bottom:46px;}
  .cat{position:relative;aspect-ratio:3/4;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px;overflow:hidden;background:var(--t1);}
  .cat .cover{transition:transform .55s ease;}
  .cat:hover .cover{transform:scale(1.045);}
  .cat::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.02) 42%,rgba(0,0,0,.46) 100%);}
  .cat span{font-size:11.5px;letter-spacing:2.5px;color:var(--surface);border-bottom:1px solid var(--surface);padding-bottom:3px;position:relative;z-index:2;text-shadow:0 1px 10px rgba(0,0,0,.45);}

  .grid{display:grid;gap:16px;}
  .g5{grid-template-columns:repeat(5,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  .prod-img{position:relative;aspect-ratio:3/4;margin-bottom:10px;overflow:hidden;}
  .prod-img::after{content:'';position:absolute;inset:0;background:var(--ink);opacity:0;transition:opacity .18s;}
  .prod a:hover .prod-img::after{opacity:.04;}
  .prod-brand{font-size:10px;letter-spacing:1px;color:var(--muted);}
  .prod-name{font-size:12.5px;margin-top:3px;}
  .prod-price{font-size:12.5px;letter-spacing:.5px;margin-top:3px;}
  .prod-fav{position:absolute;top:9px;right:9px;z-index:2;width:32px;height:32px;border-radius:50%;background:var(--surface-soft);display:grid;place-items:center;font-size:14px;color:var(--ink);transition:background .15s,transform .1s;}
  .prod-fav:hover{background:var(--surface);transform:scale(1.06);}
  .prod-fav.on{color:var(--alert);}
  .prod-tag{position:absolute;bottom:9px;left:9px;z-index:2;background:var(--surface);font-size:9.5px;letter-spacing:1px;padding:4px 8px;}

  .banner{position:relative;aspect-ratio:16/7;overflow:hidden;background:var(--t4);margin-bottom:46px;}
  .banner::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.44));}
  .banner .inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 22px;}
  .banner .eyebrow{font-size:11px;letter-spacing:4px;color:rgba(255,255,255,.86);}
  .banner h3{font-size:26px;font-weight:700;letter-spacing:1px;color:var(--surface);}

  .look{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start;}
  .look-media{aspect-ratio:4/5;}
  .look-side{display:flex;flex-direction:column;gap:12px;}
  .look-item{display:flex;gap:14px;align-items:center;border:1px solid var(--hair);border-radius:8px;padding:12px 14px;background:var(--surface);transition:border-color .15s;}
  .look-item:hover{border-color:var(--line);}
  .look-thumb{width:54px;height:54px;flex-shrink:0;border-radius:5px;}
  .look-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:4px;}
  .look-total strong{font-size:19px;}
  .look-full{grid-template-columns:1fr 1fr;gap:44px;}
  .look-item .look-acts{display:flex;gap:8px;align-items:center;flex-shrink:0;}
  .look-item .look-meta{font-size:12px;color:var(--ink-2);line-height:1.5;}

  .giftband{background:var(--ink);color:var(--surface);border-radius:12px;padding:42px 46px;display:flex;justify-content:space-between;align-items:center;gap:36px;margin-bottom:46px;}
  .giftband .eyebrow{font-size:10px;letter-spacing:3px;color:var(--faint);}
  .giftband h3{font-size:26px;font-weight:700;margin:8px 0 20px;}
  .gift-card{width:190px;aspect-ratio:16/10;background:color-mix(in oklab,var(--surface) 14%,var(--ink));border-radius:10px;flex-shrink:0;display:grid;place-items:center;font-family:var(--font-logo);font-size:13px;letter-spacing:3px;}

  .brandrow{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  .brandlogo{aspect-ratio:2/1;background:var(--t7);display:grid;place-items:center;text-align:center;padding:0 12px;font-size:11px;letter-spacing:2px;color:var(--muted);transition:background .15s,color .15s;border:1px solid var(--hair-2);}
  .brandlogo:hover{background:var(--t3);color:var(--ink);}
  .brandcard{position:relative;aspect-ratio:4/3;display:block;overflow:hidden;background:var(--t1);}
  .brandcard .cover{transition:transform .55s ease;}
  .brandcard:hover .cover{transform:scale(1.045);}
  .brandcard span{position:absolute;inset:auto 0 0 0;z-index:2;padding:16px 14px 13px;font-size:11.5px;letter-spacing:2px;color:var(--surface);background:linear-gradient(0deg,rgba(0,0,0,.66),transparent);}
  .brandcard span em{display:block;font-style:normal;font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.82);margin-top:4px;}
  .brandsearch{margin-top:16px;border:1px solid var(--hair);border-radius:999px;padding:17px 26px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);transition:border-color .15s;}
  .brandsearch:hover{border-color:var(--ink);}
  .brandsearch b{color:var(--ink);font-weight:600;}
  .brandsearch .go{color:var(--ink);}

  .sitefoot{border-top:1px solid var(--hair);padding:42px 0 26px;background:var(--bg);}
  .foot-services{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:34px;border-bottom:1px solid var(--hair-2);}
  .foot-services>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;}
  .foot-services>div+div{border-left:1px solid var(--hair);}
  .foot-services svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;}
  .foot-services h4{font-size:11px;letter-spacing:2px;}
  .foot-services p{font-size:11.5px;color:var(--muted);line-height:1.6;}
  .foot-grid{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:34px;padding:34px 0;}
  .foot-grid h5{font-size:11px;letter-spacing:2px;margin-bottom:15px;}
  .foot-grid a,.foot-grid p{display:block;font-size:12px;color:var(--muted);margin-bottom:9px;line-height:1.6;text-align:left;}
  .foot-grid a:hover{color:var(--ink);}
  .foot-brand .logo{font-size:20px;margin-bottom:14px;}
  .foot-brand p{max-width:34ch;}
  .foot-bottom{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--hair-2);padding-top:20px;font-size:11px;color:var(--muted);}

  /* ── listado ──────────────────────────────────────────────────── */
  .crumbs{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--muted);padding:20px 0 6px;flex-wrap:wrap;}
  .crumbs a:hover{color:var(--ink);text-decoration:underline;}
  .crumbs .sep{color:var(--faint);}
  .pagehead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0 16px;gap:16px;}
  .pagehead h1{font-size:32px;font-weight:700;letter-spacing:1px;}
  .pagehead .count{font-size:12px;color:var(--muted);}
  .cats-row{display:flex;gap:24px;border-bottom:1px solid var(--hair);flex-wrap:wrap;}
  .cats-row a{font-size:13px;letter-spacing:1px;padding:15px 0;border-bottom:2px solid transparent;color:var(--ink-2);margin-bottom:-1px;}
  .cats-row a:hover{color:var(--ink);}
  .cats-row a.on{color:var(--ink);border-bottom-color:var(--ink);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--hair);padding:16px 0;margin-bottom:24px;flex-wrap:wrap;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .chip{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:12px;display:inline-flex;gap:8px;align-items:center;transition:.15s;background:var(--surface);}
  .chip:hover{border-color:var(--ink);}
  .chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink);}
  .chip .chev{color:var(--faint);}
  .chip.on .chev{color:var(--surface);}
  .sort{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12px;color:var(--ink-2);background:var(--surface);}
  .sort:hover{border-color:var(--ink);color:var(--ink);}
  .fpanel{border:1px solid var(--hair);border-radius:12px;padding:18px 20px;margin:-8px 0 24px;background:var(--surface);}
  .fpanel h6{font-size:10.5px;letter-spacing:2px;color:var(--muted);margin:0 0 12px;font-weight:600;}
  .fopts{display:flex;gap:8px;flex-wrap:wrap;}
  .fopt{border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:12px;color:var(--ink-2);transition:.15s;}
  .fopt:hover{border-color:var(--ink);}
  .fopt.on{background:var(--ink);color:var(--surface);border-color:var(--ink);}
  .fclear{margin-top:14px;font-size:11.5px;color:var(--muted);text-decoration:underline;}
  .fclear:hover{color:var(--ink);}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:56px 24px;text-align:center;color:var(--muted);font-size:13px;}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:8px;}

  /* ── ficha de producto ────────────────────────────────────────── */
  .pdp{display:grid;grid-template-columns:1.12fr 1fr;gap:56px;padding:26px 0 54px;}
  .pdp-gallery{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start;}
  .pdp-thumbs{display:flex;flex-direction:column;gap:10px;}
  .pdp-thumb{aspect-ratio:1/1;cursor:pointer;padding:0;}
  .pdp-thumb.on{outline:1px solid var(--ink);outline-offset:2px;}
  .pdp-main{aspect-ratio:4/5;position:relative;}
  .pdp-brand{font-size:11px;letter-spacing:2px;color:var(--muted);}
  .pdp-title{font-size:30px;font-weight:600;margin-top:6px;}
  .pdp-rating{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted);}
  .pdp-rating .stars{letter-spacing:2px;color:var(--ink);}
  .pdp-rating a{text-decoration:underline;}
  .pdp-price{font-size:22px;margin-top:12px;}
  .pdp-stock{font-size:12px;color:var(--ok);margin-top:8px;}
  .opt-label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;color:var(--muted);margin:24px 0 12px;gap:12px;}
  .opt-label button{text-decoration:underline;}
  .swatches{display:flex;gap:10px;}
  .swatch{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);cursor:pointer;transition:.15s;}
  .swatch.on{outline:2px solid var(--ink);outline-offset:2px;}
  .sizes{display:flex;gap:10px;flex-wrap:wrap;}
  .size-opt{min-width:50px;height:44px;padding:0 12px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;transition:.15s;background:var(--surface);}
  .size-opt:hover{border-color:var(--ink);}
  .size-opt.on{border-color:var(--ink);background:var(--ink-soft);}
  .size-opt.off{color:var(--faint);border-color:var(--hair-2);cursor:not-allowed;text-decoration:line-through;}
  .pdp-buy{margin-top:26px;display:flex;gap:12px;align-items:stretch;}
  .qty{display:flex;align-items:center;border:1px solid var(--line);flex-shrink:0;}
  .qty button{width:42px;height:100%;min-height:46px;display:grid;place-items:center;font-size:16px;color:var(--ink-2);transition:background .15s;}
  .qty button:hover{background:var(--hair-2);color:var(--ink);}
  .qty span{min-width:34px;text-align:center;font-size:13px;}
  .acc{border-top:1px solid var(--hair-2);}
  .acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-size:12.5px;letter-spacing:.6px;text-align:left;gap:12px;}
  .acc-body{display:none;padding:0 0 18px;font-size:13px;color:var(--ink-2);line-height:1.8;max-width:64ch;}
  .acc.open .acc-body{display:block;}
  .acc-plus{color:var(--faint);transition:transform .2s;flex-shrink:0;}
  .acc.open .acc-plus{transform:rotate(45deg);}
  .reviews{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:8px;}
  .review{border-top:1px solid var(--hair-2);padding-top:14px;}
  .review-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;gap:10px;}
  .review p{font-size:12.5px;color:var(--ink-2);line-height:1.7;}
  .review-head .stars{color:var(--ink);letter-spacing:2px;}

  /* ── página de marca ──────────────────────────────────────────── */
  .brandhero{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--t2);}
  .brandhero::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.26),rgba(0,0,0,.5));}
  .brandhero .inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--surface);padding:0 22px;}
  .brandhero .since{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.82);}
  .brandhero h1{font-size:clamp(24px,5.4vw,50px);font-weight:700;letter-spacing:6px;line-height:1.05;text-shadow:0 2px 22px rgba(0,0,0,.35);}

  .pdp-play{position:absolute;left:14px;bottom:14px;z-index:3;background:rgba(0,0,0,.62);color:var(--surface);font-size:10px;letter-spacing:1.5px;padding:7px 12px;}
  .about{display:grid;grid-template-columns:1fr 1.4fr;gap:32px;align-items:center;}
  .about .ph{aspect-ratio:1/1;}

  /* ── búsqueda / cuenta / gift / ayuda ─────────────────────────── */
  .searchbar{display:flex;align-items:center;gap:14px;border:1px solid var(--ink);border-radius:999px;padding:16px 24px;background:var(--surface);}
  .searchbar svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.3;flex-shrink:0;}
  .searchbar input{border:0;outline:0;flex:1;font:inherit;font-size:15px;color:var(--ink);background:transparent;min-width:0;}
  .chipsoft{border:1px solid var(--hair);border-radius:999px;padding:8px 15px;font-size:12px;color:var(--ink-2);background:var(--surface);}
  .chipsoft:hover{border-color:var(--ink);color:var(--ink);}

  .account{display:grid;grid-template-columns:300px 1fr;gap:48px;padding:34px 0 54px;align-items:start;}
  .acc-side{border:1px solid var(--hair);border-radius:12px;padding:22px;background:var(--surface);}
  .acc-user{display:flex;gap:14px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--hair-2);margin-bottom:12px;}
  .avatar{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:17px;flex-shrink:0;}
  .acc-user .nm{font-size:13.5px;font-weight:600;}
  .acc-user .em{font-size:11px;color:var(--muted);margin-top:3px;}
  .acc-nav a,.acc-nav button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 0;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--hair-2);text-align:left;gap:10px;}
  .acc-nav a:hover,.acc-nav button:hover{color:var(--ink);}
  .acc-nav .on{color:var(--ink);font-weight:600;}
  .acc-nav .danger{color:var(--alert);border-bottom:0;}
  .acc-panel h3{font-size:16px;letter-spacing:1px;border-bottom:1px solid var(--hair);padding-bottom:14px;margin-bottom:20px;}
  .order-row{display:flex;justify-content:space-between;align-items:center;gap:16px;border:1px solid var(--hair);border-radius:10px;padding:17px 20px;font-size:12.5px;}
  .order-row+.order-row{margin-top:10px;}
  .order-row .meta{color:var(--muted);font-size:11.5px;}
  .addr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;}
  .addr{border:1px solid var(--hair);border-radius:10px;padding:18px;font-size:12.5px;line-height:1.8;color:var(--ink-2);}
  .addr b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px;}

  .gift-page{display:grid;grid-template-columns:1fr 1fr;gap:56px;padding:32px 0 56px;align-items:start;}
  .giftcard-big{aspect-ratio:16/10;background:var(--ink);border-radius:14px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;color:var(--surface);}
  .giftcard-big .brand{font-family:var(--font-logo);font-size:15px;letter-spacing:3px;}
  .giftcard-big .val{font-size:34px;font-weight:700;}
  .amounts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .amt{border:1px solid var(--hair);border-radius:8px;padding:12px 22px;font-size:13px;transition:.15s;background:var(--surface);}
  .amt:hover{border-color:var(--ink);}
  .amt.on{border-color:var(--ink);background:var(--ink-soft);}
  .field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .field label{font-size:11px;letter-spacing:1.5px;color:var(--muted);}
  .field input,.field textarea{border:1px solid var(--hair);border-radius:8px;padding:14px 16px;font:inherit;font-size:13px;outline:0;background:var(--surface);color:var(--ink);width:100%;}
  .field input:focus,.field textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink-soft);}
  .field textarea{min-height:96px;resize:vertical;}
  .field .err{font-size:11px;color:var(--alert);}
  .field.bad input{border-color:var(--alert);}
  .redeem{display:flex;gap:10px;margin-top:14px;}
  .redeem input{flex:1;border:1px solid var(--hair);border-radius:8px;padding:14px 16px;font:inherit;font-size:13px;color:var(--ink);outline:0;min-width:0;}
  .redeem input:focus{border-color:var(--ink);}

  .help{display:grid;grid-template-columns:1.5fr 1fr;gap:56px;padding:32px 0 56px;align-items:start;}
  .help-side{display:flex;flex-direction:column;gap:22px;}
  .help-block{border:1px solid var(--hair);border-radius:12px;padding:26px;background:var(--surface);}
  .help-block h5{font-size:11px;letter-spacing:2px;margin-bottom:16px;}
  .help-links{display:flex;flex-direction:column;gap:11px;}
  .help-links a{font-size:12.5px;text-decoration:underline;color:var(--ink-2);}
  .help-links a:hover{color:var(--ink);}
  .help-dark{background:var(--ink);color:var(--surface);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:16px;}
  .help-dark h5{font-size:11px;letter-spacing:2px;color:var(--surface);}
  .help-dark .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px;gap:12px;}
  .help-dark .foot a:hover{color:var(--surface);text-decoration:underline;}

  /* ── carrito (drawer) ─────────────────────────────────────────── */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.46);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:110;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--surface);z-index:120;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease;box-shadow:-20px 0 60px rgba(0,0,0,.14);}
  .drawer.open{transform:none;}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--hair);}
  .drawer-head h3{font-size:13px;letter-spacing:2px;}
  .drawer-close{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:16px;color:var(--ink-2);transition:background .15s,color .15s;}
  .drawer-close:hover{background:var(--hair-2);color:var(--ink);}
  .drawer-body{flex:1;overflow-y:auto;padding:8px 24px;}
  .line{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--hair-2);}
  .line-img{width:72px;aspect-ratio:3/4;flex-shrink:0;}
  .line-body{flex:1;min-width:0;}
  .line-brand{font-size:10px;letter-spacing:1px;color:var(--muted);}
  .line-name{font-size:12.5px;margin-top:2px;}
  .line-meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .line-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;}
  .line-price{font-size:12.5px;}
  .line-rm{font-size:11px;color:var(--muted);text-decoration:underline;}
  .line-rm:hover{color:var(--alert);}
  .qty-sm{display:flex;align-items:center;border:1px solid var(--line);}
  .qty-sm button{width:30px;height:30px;display:grid;place-items:center;font-size:14px;color:var(--ink-2);transition:background .15s;}
  .qty-sm button:hover{background:var(--hair-2);color:var(--ink);}
  .qty-sm span{min-width:28px;text-align:center;font-size:12px;}
  .drawer-foot{border-top:1px solid var(--hair);padding:20px 24px 24px;}
  .sumline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-bottom:9px;}
  .sumline.total{font-size:15px;color:var(--ink);border-top:1px solid var(--hair-2);padding-top:12px;margin-top:4px;}
  .drawer-empty{text-align:center;color:var(--muted);font-size:13px;padding:60px 20px;}

  /* ── checkout ─────────────────────────────────────────────────── */
  .checkout{display:grid;grid-template-columns:1.3fr 1fr;gap:52px;padding:28px 0 60px;align-items:start;}
  .pay-opts{display:flex;gap:10px;flex-wrap:wrap;}
  .pay{border:1px solid var(--line);border-radius:8px;padding:13px 20px;font-size:12.5px;transition:.15s;background:var(--surface);}
  .pay:hover{border-color:var(--ink);}
  .pay.on{border-color:var(--ink);background:var(--ink-soft);}
  .summary{border:1px solid var(--hair);border-radius:12px;padding:24px;background:var(--surface);}
  .summary h3{font-size:13px;letter-spacing:2px;border-bottom:1px solid var(--hair);padding-bottom:14px;margin-bottom:16px;}
  .done{border:1px solid var(--hair);border-radius:12px;padding:56px 32px;text-align:center;background:var(--surface);}
  .done .tick{width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;margin:0 auto 22px;font-size:24px;}

  /* ── toast ────────────────────────────────────────────────────── */
  .toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:140;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
  .toast{background:var(--ink);color:var(--surface);font-size:12px;letter-spacing:.6px;padding:13px 22px;border-radius:999px;box-shadow:0 14px 34px rgba(0,0,0,.22);opacity:0;transform:translateY(10px);transition:opacity .22s ease,transform .22s ease;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:none;}

  @media (max-width:1100px){
    .grid.g5{grid-template-columns:repeat(3,1fr);}
    .mainnav{gap:16px;}
    .mega-body{grid-template-columns:minmax(0,1fr) 260px;}
    .mega-cats{gap:22px 30px;}
    .mega-feat{padding-left:34px;}
    .mega-top nav{gap:20px;}
    .mega-brands{gap:0 18px;}
  }
  @media (max-width:920px){
    .wrap{padding:0 20px;}
    .sitebar>.wrap{height:60px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;}
    .menu-btn{display:grid;justify-self:start;width:44px;height:44px;}
    .mainnav{display:none;}
    .sitebar>.wrap>.logo{font-size:19px;letter-spacing:2px;text-align:center;white-space:nowrap;justify-self:center;min-width:0;}
    .actions{justify-self:end;margin-left:0;gap:0;}
    .actions .icon-btn{width:44px;height:44px;}
    .actions .icon-btn.sea{display:none;}
    .mega{display:none;}
    .mnav{display:flex;}
    .mnav-bd{display:block;}
    .grid{gap:12px;}
    .grid.g5{grid-template-columns:repeat(3,1fr);}
    .grid.g4,.grid.g3{grid-template-columns:repeat(2,1fr);}
    .grid.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:2px 20px 8px;scrollbar-width:none;-ms-overflow-style:none;}
    .grid.hs::-webkit-scrollbar{display:none;}
    .grid.hs>*{flex:0 0 42%;scroll-snap-align:start;}
    .brandrow{grid-template-columns:repeat(3,1fr);}
    .cats{grid-template-columns:repeat(3,1fr);}
    .look,.pdp,.gift-page,.help,.checkout,.account,.about,.reviews{grid-template-columns:1fr;}
    .pdp{gap:30px;}
    .pdp-gallery{grid-template-columns:68px 1fr;gap:12px;}
    .account{gap:24px;}
    .pagehead h1{font-size:26px;}
    .foot-grid{grid-template-columns:1fr 1fr;gap:24px;}
    .foot-bottom{flex-direction:column;gap:6px;}
    .giftband{flex-direction:column;align-items:flex-start;padding:30px;gap:24px;}
    .addr-grid{grid-template-columns:1fr;}
    .brandhero{aspect-ratio:4/3;}
    .banner{aspect-ratio:16/7;}
    .hero-media{aspect-ratio:4/5;}
    .hero-title{font-size:30px;}
    .hero-count{top:16px;right:12px;font-size:9.5px;}

  function filterState(slug){
    if(!S.filters[slug])S.filters[slug]={sub:'Todos',brand:[],size:[],color:[],price:'',sort:'new',panel:''};
    return S.filters[slug];
  }
  function priceMatch(p,f){
    if(!f)return true;
    if(f==='0-40')return p.price<40;
    if(f==='40-70')return p.price>=40&&p.price<70;
    if(f==='70-100')return p.price>=70&&p.price<100;
    if(f==='100+')return p.price>=100;
    return true;
  }
  function viewCat(slug,params){
    var cat=CATS.filter(function(c){return c.slug===slug;})[0];
    if(!cat)return viewNotFound();
    var f=filterState(slug);
    if(params.q)f={sub:'Todos',brand:[],size:[],color:[],price:'',sort:'new',panel:''},S.filters[slug]=f;
    if(params.sub)f.sub=decodeURIComponent(params.sub);
    var all=byCat(slug);
    var list=all.filter(function(p){
      if(f.sub!=='Todos'&&p.sub!==f.sub)return false;
      if(f.brand.length&&f.brand.indexOf(p.brand)<0)return false;
      if(f.size.length&&!f.size.some(function(s){return p.sizes.indexOf(s)>-1;}))return false;
      if(f.color.length&&!f.color.some(function(c){return p.colors.some(function(x){return x.n===c;});}))return false;
      if(!priceMatch(p,f.price))return false;
      return true;
    });
    if(f.sort==='asc')list.sort(function(a,b){return a.price-b.price;});
    if(f.sort==='desc')list.sort(function(a,b){return b.price-a.price;});
    var active=[].concat(f.brand,f.size,f.color).length+(f.price?1:0)+(f.sub!=='Todos'?1:0);
    var panel='';
    if(f.panel){
      var opts=[];
      if(f.panel==='brand')opts=BRANDS.filter(function(b){return all.some(function(p){return p.brand===b;});}).map(function(b){return {v:b,l:b};});
      else if(f.panel==='size'){var set={};all.forEach(function(p){p.sizes.forEach(function(s){set[s]=1;});});opts=Object.keys(set).map(function(s){return {v:s,l:s};});}
      else if(f.panel==='color')opts=COLS.map(function(c){return {v:c.n,l:c.n};});
      else if(f.panel==='price')opts=[{v:'0-40',l:'Menos de $40'},{v:'40-70',l:'$40 – $70'},{v:'70-100',l:'$70 – $100'},{v:'100+',l:'$100 o más'}];
      var cur=f.panel==='price'?[f.price]:f[f.panel];
      panel='<div class="fpanel"><h6>FILTRAR POR '+f.panel.toUpperCase()+'</h6><div class="fopts">'+
        opts.map(function(o){return '<button class="fopt'+(cur.indexOf(o.v)>-1?' on':'')+'" data-fopt="'+esc(o.v)+'">'+esc(o.l)+'</button>';}).join('')+
        '</div><button class="fclear" data-fclear>Limpiar filtros ('+active+')</button></div>';
    }
    var chip=function(id,label,on){return '<button class="chip'+(on?' on':'')+'" data-fpanel="'+id+'">'+label+' <span class="chev">⌄</span></button>';};
    return '<div class="wrap" data-od-id="view-category">'+
      '<nav class="crumbs" aria-label="Ruta"><a href="#/">Inicio</a><span class="sep">/</span><span>'+esc(cat.name)+'</span></nav>'+
      '<div class="pagehead"><div><h1>'+esc(cat.name.toUpperCase())+'</h1><div class="sec-rule"></div></div><span class="count">'+list.length+' de '+all.length+' productos</span></div>'+
      '<div class="cats-row"><a class="'+(f.sub==='Todos'?'on':'')+'" data-sub="Todos" href="#/c/'+slug+'">Todos</a>'+
        cat.subs.map(function(s){return '<a class="'+(f.sub===s?'on':'')+'" data-sub="'+esc(s)+'" href="#/c/'+slug+'?sub='+encodeURIComponent(s)+'">'+esc(s)+'</a>';}).join('')+'</div>'+
      '<div class="toolbar"><div class="chips">'+
        chip('size','Talla',f.size.length>0)+chip('price','Precio',!!f.price)+chip('color','Color',f.color.length>0)+chip('brand','Marca',f.brand.length>0)+
        (active?'<button class="chip" data-fclear>Limpiar ('+active+') ✕</button>':'')+
      '</div>'+
      '<button class="sort" data-sort>Ordenar: '+(f.sort==='asc'?'Precio ↑':f.sort==='desc'?'Precio ↓':'Más nuevo')+' ⌄</button></div>'+
      panel+grid(list,'','g4')+
      '<div style="height:64px"></div></div>';
  }

  /* ── router ─────────────────────────────────────────────────── */
  function parse(){
    var raw=location.hash.replace(/^#\/?/,''),q='';
    var qi=raw.indexOf('?');
    if(qi>-1){q=raw.slice(qi+1);raw=raw.slice(0,qi);}
    var parts=raw.split('/').filter(Boolean),params={};
    q.split('&').filter(Boolean).forEach(function(kv){var i=kv.indexOf('=');params[decodeURIComponent(kv.slice(0,i))]=decodeURIComponent(kv.slice(i+1)||'');});
    return {parts:parts,params:params};
  }
  function currentRoute(){
    var r=parse(),p=r.parts;
    if(!p.length)return {name:'home'};
    if(p[0]==='c')return {name:'cat',slug:p[1]};
    if(p[0]==='p')return {name:'pdp',key:p[1]};
    if(p[0]==='marcas')return {name:'brands'};
    if(p[0]==='m')return {name:'brand',slug:p[1]};
    if(p[0]==='buscar')return {name:'search'};
    if(p[0]==='favoritos')return {name:'favs'};
    if(p[0]==='cuenta')return {name:'account'};
    if(p[0]==='look')return {name:'look'};
    if(p[0]==='gift-card')return {name:'gift'};
    if(p[0]==='ayuda')return {name:'help'};
    if(p[0]==='checkout')return {name:'checkout'};
    if(p[0]==='done')return {name:'done',order:p[1]};
    return {name:'404'};
  }
  function render(){
    var r=parse(),rt=currentRoute(),html='';
    if(rt.name==='home'){html=viewHome();playHero();}
    else if(rt.name==='cat'){stopHero();html=viewCat(rt.slug,r.params);}
    else if(rt.name==='pdp'){stopHero();html=viewPDP(rt.key);}
    else if(rt.name==='brands'){stopHero();html=viewBrands();}
    else if(rt.name==='brand'){stopHero();html=viewBrand(rt.slug);}
    else if(rt.name==='search'){stopHero();html=viewSearch(r.params);}
    else if(rt.name==='favs'){stopHero();html=viewFavs();}
    else if(rt.name==='account'){stopHero();html=viewAccount();}
    else if(rt.name==='look'){stopHero();html=viewLook();}
    else if(rt.name==='gift'){stopHero();html=viewGift();}
    else if(rt.name==='help'){stopHero();html=viewHelp();}
    else if(rt.name==='checkout'){stopHero();html=viewCheckout();}
    else if(rt.name==='done'){stopHero();html=viewDone(rt.order);}
    else {stopHero();html=viewNotFound();}
    var app=$('#app');app.innerHTML=html;app.setAttribute('data-view',rt.name);
    $('#sitebar').innerHTML=headerHTML(rt.name);
    $('#sitefoot').innerHTML=footerHTML();
    if(rt.name==='search'){var s=$('#q');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length);}}
    document.title='Clothon — '+({home:'Inicio',cat:catName(rt.slug||''),pdp:(BY[rt.key]||{}).name||'Producto',brands:'Marcas',brand:rt.slug,search:'Buscar',favs:'Favoritos',account:'Mi cuenta',look:'Arma tu look',gift:'Gift card',help:'Ayuda',checkout:'Checkout',done:'Pedido confirmado'}[rt.name]||rt.name);
  }

  }
  function openDrawer(){renderDrawer();$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');$('#overlay').classList.add('open');document.body.style.overflow='hidden';}
  function closeDrawer(){$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');$('#overlay').classList.remove('open');document.body.style.overflow='';}
  function openMenu(){var m=$('#mnav'),b=$('#mnav-bd');if(!m)return;m.classList.add('open');m.setAttribute('aria-hidden','false');if(b)b.classList.add('open');document.body.style.overflow='hidden';var btn=$('[data-menu]');if(btn)btn.setAttribute('aria-expanded','true');}
  function closeMenu(){var m=$('#mnav'),b=$('#mnav-bd');if(m){m.classList.remove('open');m.setAttribute('aria-hidden','true');}if(b)b.classList.remove('open');document.body.style.overflow='';var btn=$('[data-menu]');if(btn)btn.setAttribute('aria-expanded','false');}

  /* ── eventos ────────────────────────────────────────────────── */
  document.addEventListener('click',function(e){
    var t=e.target;
    var go=t.closest('[data-go]'); if(go){location.hash=go.getAttribute('data-go');return;}
    if(t.closest('[data-menu]')){openMenu();return;}
    if(t.closest('[data-menu-close]')){closeMenu();return;}
    if(t.closest('#mnav a')){closeMenu();}
    if(t.closest('[data-drawer]')){openDrawer();return;}
    if(t.closest('[data-drawer-close]')){closeDrawer();return;}
    var fav=t.closest('[data-fav]'); if(fav){e.preventDefault();toggleFav(fav.getAttribute('data-fav'));return;}
    var sl=t.closest('[data-slide]'); if(sl){slide=(slide+parseInt(sl.getAttribute('data-slide'),10)+SLIDES.length)%SLIDES.length;updateHero();playHero();return;}
    var st=t.closest('[data-slide-to]'); if(st){slide=parseInt(st.getAttribute('data-slide-to'),10);updateHero();playHero();return;}
    var sw=t.closest('[data-swatch]'); if(sw){var name=sw.getAttribute('data-swatch');$$('[data-swatch]').forEach(function(s){s.classList.remove('on');});sw.classList.add('on');var lbl=$('#pdp-color');if(lbl)lbl.textContent=name.toUpperCase();if(window.__pdp)window.__pdp.color=name;return;}
    var sz=t.closest('[data-size]'); if(sz){$$('[data-size]').forEach(function(s){s.classList.remove('on');});sz.classList.add('on');if(window.__pdp)window.__pdp.size=sz.getAttribute('data-size');return;}
    var th=t.closest('[data-thumb]'); if(th){var i=th.getAttribute('data-thumb');$$('[data-thumb]').forEach(function(s){s.classList.remove('on');});th.classList.add('on');var m=$('#pdp-main');var pr=BY[currentRoute().key];if(m&&pr){window.__pdp.thumb=i;m.innerHTML=pimg(pr.key,pr.name)+(parseInt(i,10)===3?'<span class="pdp-play">▶ VIDEO DEL PRODUCTO</span>':'');}return;}
    var acc=t.closest('[data-acc]'); if(acc){acc.parentNode.classList.toggle('open');return;}
    var qb=t.closest('[data-qty]'); if(qb&&window.__pdp){window.__pdp.qty=Math.max(1,window.__pdp.qty+parseInt(qb.getAttribute('data-qty'),10));$('#pdp-qty').textContent=window.__pdp.qty;return;}
    if(t.closest('[data-add-pdp]')){var k=currentRoute().key,s=window.__pdp;addToCart(k,s?s.size:null,s?s.color:null,s?s.qty:1);openDrawer();return;}
    var lb=t.closest('[data-line]'); if(lb){setQty(lb.getAttribute('data-line'),parseInt(lb.getAttribute('data-d'),10));return;}
    var rm=t.closest('[data-rm]'); if(rm){removeLine(rm.getAttribute('data-rm'));return;}
    var fp=t.closest('[data-fpanel]'); if(fp){var f=filterState(currentRoute().slug);f.panel=f.panel===fp.getAttribute('data-fpanel')?'':fp.getAttribute('data-fpanel');render();return;}
    var fo=t.closest('[data-fopt]'); if(fo){e.preventDefault();var fs=filterState(currentRoute().slug);var v=fo.getAttribute('data-fopt');
      if(fs.panel==='price')fs.price=fs.price===v?'':v;
      else{var arr=fs[fs.panel];var idx=arr.indexOf(v);if(idx>-1)arr.splice(idx,1);else arr.push(v);}
      render();return;}
    if(t.closest('[data-fclear]')){e.preventDefault();S.filters[currentRoute().slug]={sub:'Todos',brand:[],size:[],color:[],price:'',sort:'new',panel:''};render();return;}
    var so=t.closest('[data-sort]'); if(so){var f2=filterState(currentRoute().slug);f2.sort=f2.sort==='new'?'asc':(f2.sort==='asc'?'desc':'new');render();return;}
    var sub=t.closest('[data-sub]'); if(sub){e.preventDefault();var f3=filterState(currentRoute().slug);f3.sub=sub.getAttribute('data-sub');var nh='#/c/'+currentRoute().slug+(f3.sub!=='Todos'?'?sub='+encodeURIComponent(f3.sub):'');if(nh===location.hash)render();else location.hash=nh;return;}
    var rc=t.closest('[data-recent]'); if(rc){location.hash='#/buscar?q='+encodeURIComponent(rc.getAttribute('data-recent'));return;}
    var at=t.closest('[data-acc-tab]'); if(at){S.accTab=at.getAttribute('data-acc-tab');render();return;}
    if(t.closest('[data-logout]')){toast('Sesión cerrada (demo)');return;}
    var sp=t.closest('[data-swap]'); if(sp){var ix=parseInt(sp.getAttribute('data-swap'),10);var cat=BY[LOOK[ix][0]].cat;var opts=byCat(cat);var cur=opts.map(function(p){return p.key;}).indexOf(LOOK[ix][0]);LOOK[ix][0]=opts[(cur+1)%opts.length].key;LOOK[ix][1]=BY[LOOK[ix][0]].sizes[0];render();toast('Prenda cambiada');return;}
    if(t.closest('[data-add-look]')){LOOK.forEach(function(it){addToCart(it[0],it[1],null,1);});openDrawer();return;}
    var amt=t.closest('[data-amt]'); if(amt){var v2=amt.getAttribute('data-amt');S.giftAmt=v2==='custom'?'custom':parseInt(v2,10);render();return;}
    var pay=t.closest('[data-pay]'); if(pay){S.pay=pay.getAttribute('data-pay');render();return;}
  });

  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='q'){var v=t.value.trim();if(v.length>1){var h='#/buscar?q='+encodeURIComponent(v);if(location.hash!==h)history.replaceState(null,'',h);}renderSearchResults(v);}
    if(t.id==='f-cat'){var cat=t.value,sel=$('#f-size');if(sel){var key=cat==='zapatos'?'zapatos':cat==='pantalones'?'pantalones':cat==='accesorios'?'accesorios':'ropa';sel.innerHTML='<option value="">Talla</option>'+SZ[key].map(function(s){return '<option>'+s+'</option>';}).join('');}}
    if(t.id==='gift-custom-val'){S.giftAmt='custom';var gv=$('#gift-value');if(gv)gv.textContent='$ '+(t.value||'—');}
  });
  function renderSearchResults(v){
    if(currentRoute().name!=='search')return;
    var list=v?P.filter(function(p){return (p.name+' '+p.brand+' '+catName(p.cat)).toLowerCase().indexOf(v.toLowerCase())>-1;}):[];
    var sec=$$('#app .sec')[0];if(!sec)return;
    sec.innerHTML='<div class="sec-head"><div class="sec-title">'+(v?list.length+' RESULTADO'+(list.length===1?'':'S')+' PARA «'+esc(v.toUpperCase())+'»':'ESCRIBE PARA BUSCAR')+'</div><span class="sort">Relevancia ⌄</span></div>'+
      (v?grid(list,'','g4'):'<div class="empty"><b>Empieza a escribir</b>Busca por nombre, marca o categoría.</div>');
  }

  $('#overlay').addEventListener('click',closeDrawer);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDrawer();closeMenu();closeMega();}});

  var sitebar=$('#sitebar');
  function openMega(link){
    var m=$('#mega');if(!m)return;m.classList.add('open');
    var h=link&&link.getAttribute('href')||'';
    var mm=h.match(/#\/c\/([^?]+)/);
    setMegaActive(mm?mm[1]:'');
  }
  sitebar.addEventListener('mouseover',function(e){var dd=e.target.closest('[data-dd]');if(dd)openMega(dd);});
  sitebar.addEventListener('mouseover',function(e){var c=e.target.closest('#mega .mega-cat');if(c)setFeat(c.getAttribute('data-cat'));});
  sitebar.addEventListener('focusin',function(e){var c=e.target.closest('#mega .mega-cat');if(c)setFeat(c.getAttribute('data-cat'));});
  sitebar.addEventListener('mouseleave',function(){closeMega();});
  sitebar.addEventListener('click',function(e){if(e.target.closest('#mega a'))closeMega();});
  sitebar.addEventListener('focusin',function(e){var dd=e.target.closest('[data-dd]');if(dd)openMega(dd);});

  document.addEventListener('submit',function(e){
    var f=e.target;
    if(f.id==='finder-form'){e.preventDefault();var c=$('#f-cat').value,s=$('#f-size').value,br=$('#f-brand')?$('#f-brand').value:'';
      if(!c&&!br){toast('Elige una categoría o una marca');return;}
      if(!c){location.hash='#/m/'+brandSlug(br);return;}
      location.hash='#/c/'+c;setTimeout(function(){var fs=filterState(c);if(s)fs.size=[s];if(br)fs.brand=[br];if(s||br)fs.panel=br?'brand':'size';render();},0);return;}
    if(f.id==='search-form'){e.preventDefault();var q=$('#q').value.trim();if(q){S.recent=[q].concat(S.recent.filter(function(x){return x!==q;})).slice(0,5);save('clothon-recent',S.recent);location.hash='#/buscar?q='+encodeURIComponent(q);}return;}
    if(f.id==='gift-form'){e.preventDefault();var to=$('#gift-to'),fl=$('#gift-to-field');var ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to.value);
      fl.classList.toggle('bad',!ok);$('.err',fl).hidden=ok;
      if(!ok){to.focus();return;}
      addGiftToCart();return;}
    if(f.id==='redeem-form'){e.preventDefault();var code=$('#redeem-code');if(!code.value.trim()){toast('Escribe el código de la tarjeta');return;}toast('Código «'+code.value.trim().toUpperCase()+'» verificado');code.value='';return;}
    if(f.id==='co-form'){e.preventDefault();var ids=[['co-name','co-name-field'],['co-mail','co-mail-field'],['co-addr','co-addr-field']],okAll=true;
      ids.forEach(function(pair){var inp=$('#'+pair[0]),fl2=$('#'+pair[1]);var val=inp.value.trim();var good=pair[0]==='co-mail'?/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val):!!val;
        fl2.classList.toggle('bad',!good);$('.err',fl2).hidden=good;if(!good&&okAll){inp.focus();okAll=false;}});
      if(!okAll)return;
      var order='#'+Math.floor(10500+Math.random()*400);
      S.cart=[];save('clothon-cart',S.cart);syncChrome();closeDrawer();
      location.hash='#/done/'+order.replace('#','');
      render();
      return;}
  });
  function addGiftToCart(){
    var g=S.giftAmt==='custom'?parseInt($('#gift-custom-val').value,10):(S.giftAmt||25);
    if(!g||g<10){toast('El monto mínimo es $10');return;}
    S.cart.push({id:'gift|'+g+'|'+Date.now(),key:'giftcard',size:'—',color:'—',qty:1,price:g});
    save('clothon-cart',S.cart);syncChrome();openDrawer();
    toast('Gift card de $'+g+' añadida al carrito');
  }

  window.addEventListener('hashchange',function(){closeMenu();closeMega();render();window.scrollTo(0,0);});
  render();
})();
</script>
</body>
</html>
